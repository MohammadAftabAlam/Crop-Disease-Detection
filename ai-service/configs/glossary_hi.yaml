# English -> Hindi farming terms, swapped into the English text BEFORE machine translation.
# A general translation model gets these words wrong (it turned "whorl" into "horse rider" and
# "caterpillars" into "vultures"), so the correct Hindi term is put in place and the model
# translates the rest of the sentence around it.
# Longer phrases win over shorter ones; matching ignores case and respects word boundaries.
# To fix a wrong word in the app, add it here and clear the translations table in MySQL.

