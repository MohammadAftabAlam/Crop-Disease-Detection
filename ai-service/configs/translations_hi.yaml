"Rapid leaf damage": "पत्तियों को तेज़ी से नुकसान"
"Brown or black patches": "भूरे या काले धब्बे"
"No visible disease spots": "रोग का कोई धब्बा दिखाई नहीं देता"
"No visible disease lesions": "रोग का कोई धब्बा दिखाई नहीं देता"
"Water splashing": "पानी के छींटे"
"Water splashing between plants": "पौधों के बीच पानी के छींटे"
"Avoid handling plants when wet": "पौधे गीले हों तो उन्हें न छुएं"
"Warm (24-30 °C), wet weather; spread by rain splash, wind-driven rain and handling": "गर्म (24-30 °C) और गीला मौसम; बारिश की छींटों, हवा के साथ आई बारिश और पौधों को छूने से फैलता है"
"Do not leave cull potatoes in heaps near the field": "छांटे गए ख़राब आलुओं के ढेर खेत के पास न छोड़ें"
"Moderate temperatures (about 20-25 °C) with wet leaves; spread by rain splash": "गीली पत्तियों के साथ मध्यम तापमान (लगभग 20-25 °C); बारिश की छींटों से फैलता है"
"High humidity (above 85%) and moderate temperatures, common in poorly ventilated polyhouses": "उच्च आर्द्रता (85% से अधिक) और मध्यम तापमान; कम हवादार पॉलीहाउस में आम"
"Mold growth on leaf undersides": "पत्ती की निचली सतह पर फफूंद"
"Small, oval, cinnamon-brown powdery pustules on both sides of the leaf": "पत्ती के दोनों ओर छोटे, अंडाकार, दालचीनी जैसे भूरे पाउडर वाले फफोले"
"Windborne rust spores": "हवा से फैलने वाले रतुआ के बीजाणु"
"Wilting of seedlings (kresek) in severe cases": "गंभीर मामलों में पौध का मुरझाना (क्रेसेक)"
"Stripe rust of wheat, producing yellow pustules in long stripes; serious in cool weather in North India.": "गेहूं का पीला (धारीदार) रतुआ, जिसमें लंबी धारियों में पीले फफोले बनते हैं; उत्तर भारत में ठंडे मौसम में गंभीर।"
"Starts in patches and spreads quickly in cool weather": "खेत में जगह-जगह शुरू होता है और ठंडे मौसम में तेज़ी से फैलता है"
"Report patches early to the local agriculture office": "प्रभावित जगहों की जानकारी जल्दी स्थानीय कृषि कार्यालय को दें"
"Papery 'window-pane' patches on young leaves": "छोटी पत्तियों पर कागज़ जैसे पारदर्शी (खिड़की जैसे) धब्बे"
"Leaves turn bronze or yellow and dry from the tips": "पत्तियां कांसे जैसी या पीली होकर सिरों से सूखने लगती हैं"
"Tiny reddish-brown mites, best seen with a hand lens": "छोटे लाल-भूरे माइट, जो आवर्धक लेंस (हैंड लेंस) से सबसे अच्छे दिखते हैं"
"Check the lower leaves with a hand lens for mites": "आवर्धक लेंस से निचली पत्तियों पर माइट देखें"
"Sow on time; late-sown wheat is attacked more": "समय पर बुवाई करें; देर से बोए गए गेहूं पर अधिक प्रकोप होता है"
"Badly attacked fields look whitish and dry": "अधिक प्रकोप वाले खेत सफ़ेद और सूखे दिखते हैं"
"Correct nutrient deficiencies with balanced fertiliser": "संतुलित खाद देकर पोषक तत्वों की कमी दूर करें"
"AI-generated guidance from a general knowledge base. Confirm with a local agriculture expert before using any pesticide.": "यह सलाह AI ने एक सामान्य जानकारी-संग्रह (नॉलेज बेस) से बनाई है। किसी भी कीटनाशक के उपयोग से पहले स्थानीय कृषि विशेषज्ञ से पुष्टि करें।"
"No disease spots found": "रोग के धब्बे नहीं मिले"
"This does not look like a disease the model knows.": "यह मॉडल का पहचाना हुआ कोई रोग नहीं लगता।"
"Photo not recognised as a supported crop leaf": "फ़ोटो किसी समर्थित फसल की पत्ती के रूप में पहचानी नहीं गई"
"Use only as per the label. Wear protection and respect the waiting period before harvest.": "केवल लेबल के अनुसार उपयोग करें। सुरक्षा कपड़े पहनें और कटाई से पहले की प्रतीक्षा अवधि का पालन करें।"
"If new spots appear, take another photo or contact your nearest Krishi Vigyan Kendra.": "अगर नए धब्बे दिखें तो दोबारा फ़ोटो लें या अपने नज़दीकी कृषि विज्ञान केंद्र से संपर्क करें।"
