spring.application.name=cropcare-backend

# Secrets and machine-specific values live in backend/.env (copy .env.example).
# Spring reads that file as KEY=VALUE properties.
spring.config.import=optional:file:.env[.properties]

# Port 5000 matches the frontend's default API URL (http://localhost:5000/api)
server.port=${PORT:5000}

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cropcare?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# "update" creates/alters tables from the entity classes. Fine for development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=10MB
# Up to 5 photos of 10 MB each per diagnosis
spring.servlet.multipart.max-request-size=55MB

# ---------- Email (Gmail SMTP, use an App Password) ----------
# If EMAIL_USER is empty, password-reset links are printed to the console instead.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- App ----------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry=7d
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.ai-service-url=${AI_SERVICE_URL:http://127.0.0.1:8000}
app.upload-dir=${UPLOAD_DIR:uploads}

# ---------- Photo storage (Cloudinary) ----------
# Free account: https://cloudinary.com -> Dashboard shows Cloud name, API key and API secret.
# With all three set, photos are uploaded to Cloudinary and served from its CDN.
# Empty = photos are kept in the uploads folder on this server.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:cropcare/scans}
app.cloudinary.api-url=${CLOUDINARY_API_URL:https://api.cloudinary.com/v1_1}

# ---------- "Ask about this result" chat (Google Gemini) ----------
# Free API key: https://aistudio.google.com -> Get API key. Empty = chat turned off.
# Free-tier requests may be used by Google to improve its products; only text is sent, never photos.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
# Tried in order when the main model is overloaded ("high demand", HTTP 503) or rate-limited
app.gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.5-flash-lite,gemini-3.1-flash-lite}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.chat.daily-limit=${CHAT_DAILY_LIMIT:20}
app.chat.per-prediction-limit=${CHAT_PER_PREDICTION_LIMIT:10}
app.chat.max-question-chars=300
app.chat.max-answer-tokens=2048

# ---------- Hindi translation ----------
# Priority: Google Translate (if API key set) -> local NLLB model (if enabled) -> English only.

# Google Cloud Translation API v2 (free: 500,000 chars/month).
# Get a key: https://console.cloud.google.com -> enable "Cloud Translation API" -> Credentials -> API key.
app.google-translate.api-key=${GOOGLE_TRANSLATE_API_KEY:}
app.google-translate.base-url=${GOOGLE_TRANSLATE_BASE_URL:}

# Local NLLB-200 model run by the AI service (no account needed, ~2.5 GB RAM).
app.translation.local-enabled=${TRANSLATION_LOCAL_ENABLED:true}
app.translation.warm-up=${TRANSLATION_WARM_UP:true}
