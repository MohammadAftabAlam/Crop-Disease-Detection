spring.application.name=cropcare-backend

# Secrets and machine-specific values live in backend/.env (copy .env.example).
# Spring reads that file as KEY=VALUE properties.
spring.config.import=optional:file:.env[.properties]

# Port 5000 matches the frontend's default API URL (http://localhost:5000/api)
server.port=${PORT:5000}

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cropcare?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# "update" creates/alters tables from the entity classes. Fine for development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=10MB
# Up to 5 photos of 10 MB each per diagnosis
spring.servlet.multipart.max-request-size=55MB

# ---------- Email (Gmail SMTP, use an App Password) ----------
# If EMAIL_USER is empty, password-reset links are printed to the console instead.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- App ----------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry=7d
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.ai-service-url=${AI_SERVICE_URL:http://127.0.0.1:8000}
app.upload-dir=${UPLOAD_DIR:uploads}
